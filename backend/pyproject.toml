[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shipping-ops-agent"
version = "0.4.0"
description = "Coordinator + six specialist AI agents for shipping operations (LangGraph, human-in-the-loop)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.0",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "pydantic>=2.6",
    "rich>=13.7",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
llm = ["langchain-anthropic>=0.3"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
shipping-agent = "shipping_agent.cli:main"

[tool.setuptools.package-data]
shipping_agent = ["web/*.html"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
