name: CI

on: [push, pull_request]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - run: shipping-agent demo --agent all --auto-approve

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -e ../backend
      - run: npm ci
      # Contract check: the committed TS types must match the current FastAPI schema
      - run: shipping-agent openapi --out openapi.json && npm run gen:api
      - run: git diff --exit-code openapi.json src/lib/api-types.ts
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
